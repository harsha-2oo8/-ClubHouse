name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck packages
        run: pnpm -r --filter "./artifacts/**" --filter "./scripts" --filter "./tests/**" --if-present run typecheck

      - name: Run tests
        run: pnpm -r --if-present run test

      - name: Verify OpenAPI codegen is in sync
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-client-react lib/api-zod || (echo "Generated API client/Zod is stale. Run 'pnpm --filter @workspace/api-spec run codegen' and commit." && exit 1)

      - name: Build
        run: pnpm run build
